<svg viewBox="0 0 152 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="chilly-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="chilly-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#chilly-glow)">
    <text x="2" y="58" font-family="'Fira Code', monospace" font-weight="700" font-size="48" fill="url(#chilly-grad)">
      &lt;
    </text>
    <text x="42" y="62" font-family="'Urbanist', sans-serif" font-weight="900" font-size="56" fill="url(#chilly-grad)">
      C
    </text>
    <text x="82" y="58" font-family="'Fira Code', monospace" font-weight="700" font-size="48" fill="url(#chilly-grad)">
      /&gt;
    </text>
  </g>
</svg>