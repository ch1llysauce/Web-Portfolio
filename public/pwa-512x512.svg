<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chilly-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="chilly-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;family=Urbanist:wght@900&amp;display=swap');
      .logo-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-weight: 700;
        font-size: 100px;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .letter-c {
        font-family: 'Urbanist', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 124px;
      }
    </style>
  </defs>

  <!-- Transparent Background with Single Centered Text Anchor -->
  <g filter="url(#chilly-glow)" fill="url(#chilly-grad)">
    <text x="256" y="256" class="logo-text">&lt; <tspan class="letter-c" dy="2">C</tspan><tspan dy="-2"> /&gt;</tspan></text>
  </g>
</svg>
