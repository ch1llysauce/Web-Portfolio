<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chilly-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="chilly-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;family=Urbanist:wght@900&amp;display=swap');
      .bracket {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-weight: 700;
        font-size: 112px;
      }
      .letter {
        font-family: 'Urbanist', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 132px;
      }
    </style>
  </defs>

  <!-- Background for PWA / App Icon -->
  <rect width="512" height="512" fill="#070913" />

  <!-- Centered & Glow Filtered Logo Mark -->
  <g filter="url(#chilly-glow)" fill="url(#chilly-grad)">
    <text x="82" y="292" class="bracket">&lt;</text>
    <text x="210" y="298" class="letter">C</text>
    <text x="344" y="292" class="bracket">/&gt;</text>
  </g>
</svg>

